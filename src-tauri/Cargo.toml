[package]
name = "disky"
description = "¿Qué creció en mi disco? — timeline de crecimiento por carpeta"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# El sufijo `_lib` evita conflicto bin/lib en Windows (rust-lang/cargo#8519).
name = "disky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
disky-core = { path = "../crates/disky-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json = "1"
