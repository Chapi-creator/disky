name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt · clippy · tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy estricto (pedantic + deny)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests del core (incluye pruebas de integración que exigen elevación; el runner ya la tiene)
        run: cargo test -p disky-core -- --include-ignored

  frontend:
    name: Frontend (tsc · vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
