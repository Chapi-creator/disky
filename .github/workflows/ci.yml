name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt · clippy · tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy estricto (pedantic + deny)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Los tests `#[ignore]` de MFT/USN exigen acceso a dispositivo en `C:`,
      # que el runner virtual de GitHub no permite: se corren en una máquina
      # local elevada (cargo test -p disky-core -- --include-ignored).
      - name: Tests del core
        run: cargo test -p disky-core
      # Tests del shell (comandos IPC, JSONL padre↔hijo, modo elevado): puros y
      # sin ventana, así que corren en el runner. No se ejecutaban antes porque
      # su harness no arrancaba en Windows sin el manifiesto que ahora enlaza
      # `src-tauri/build.rs`.
      - name: Tests del shell
        run: cargo test -p disky

  frontend:
    name: Frontend (tsc · vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
