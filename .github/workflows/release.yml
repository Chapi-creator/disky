name: Release

# Se dispara al publicar un tag de versión: v0.1.0, v1.2.3, ...
# Compila Tauri en modo release, empaqueta NSIS + MSI y los adjunta a la
# GitHub Release correspondiente (la crea si no existe).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # necesarios para crear la release y subir assets

jobs:
  build:
    name: Instaladores Windows (NSIS · MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Clave propia: el perfil release compila dependencias distintas
          # (LTO) que las del CI de checks, así no se pisan las cachés.
          key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Fail fast: no compilar 10 minutos para descubrir un tag mal puesto.
      - name: El tag debe coincidir con la versión de tauri.conf.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "$CONF" ]; then
            echo "::error::El tag es v$TAG pero tauri.conf.json declara $CONF."
            echo "::error::Sube el tag desde la versión correcta o actualiza la versión y vuelve a tagear."
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      # La firma que falla en silencio cuando el secret está mal pegado (ruta o
      # `.pub` en lugar de la clave). Vale más descubrirlo aquí que tras 10 min
      # de compilación: usa el mismo formato que espera el firmador de Tauri.
      - name: La clave del auto-actualizador decodifica
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r\n')
          if [ -z "$KEY" ]; then
            echo "::error::Falta el secret TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          if ! printf '%s' "$KEY" | base64 -d 2>/dev/null | head -1 | grep -q '^untrusted comment: rsign'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY no es una clave minisign"
            echo "::error::(¿pegaste la ruta del archivo, o el contenido de disky.key.pub?)."
            exit 1
          fi

      # tauri-action: compila, firma los artefactos del auto-actualizador
      # (clave minisign en secrets: NO es firma de código Authenticode) y sube
      # NSIS + MSI + los .sig y el latest.json que consulta la app al arrancar.
      - name: Build de Tauri y publicación (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Vacío a propósito: la clave se generó sin contraseña.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: disky ${{ github.ref_name }}
          releaseBody: |
            Instaladores NSIS + MSI sin firma de código, así que SmartScreen avisará
            la primera vez («Más información» → «Ejecutar de todas formas»).
            Incluye los artefactos firmados que consume el auto-actualizador.
          prerelease: false
          tauriScript: npm run tauri

      - name: Listar artefactos generados
        shell: bash
        run: |
          ls -lh target/release/bundle/nsis/
          ls -lh target/release/bundle/msi/
